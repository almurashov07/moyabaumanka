const msk=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Moscow'}));const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const monday=d=>{let x=new Date(d);x.setHours(12,0,0,0);return add(x,-(x.getDay()+6)%7)};const weekParity=d=>Math.round((monday(d)-new Date(2026,10,9,12))/604800000)%2===0?0:1;const timeMin=s=>{let [h,m]=s.split(':').map(Number);return h*60+m};const dateFmt=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>msk();const dateOfView=()=>add(now(),offset);const dayLessons=(d,override)=>applyLessonChanges(d,schedule[(d.getDay()+6)%7+1]?.[override??weekParity(d)]||[]);

function lessonHtml(l,d){const same=iso(d)===iso(now()),n=now(),mins=n.getHours()*60+n.getMinutes(),active=same&&mins>=timeMin(l.start)&&mins<timeMin(l.end);return `<div class="lesson ${active?'now':''}"><div class="row"><span class="time">◷ ${l.start}–${l.end}</span>${active?'<span class="badge green">● Сейчас</span>':''}</div><div class="lesson-title">${esc(subjects[l.sub])}</div><div class="lesson-meta">${esc(l.kind||'Занятие')}${l.teacher?' · '+esc(l.teacher):''}</div>${l.room||l.building?`<div class="lesson-meta" style="margin-top:5px">⌖ ${esc(l.room)} · ${esc(l.building)}</div>`:''}${active?`<div class="smalltext" style="margin-top:8px">До конца ${timeMin(l.end)-mins} мин</div>`:''}</div>`}
function taskRows(list){return list.map(t=>`<div class="task"><div class="row"><span class="smalltext">${esc(subjects[t.sub])}</span><span class="badge ${badgeClass(t.status)}">${esc(t.status)}</span></div><div class="task-title">${esc(t.title)}</div><div class="row"><span class="datebadge">◷ ${dateFmt(t.date)}</span>${t.note?`<span class="smalltext">${esc(t.note)}</span>`:''}</div><div class="task-actions"><select aria-label="Статус задания" onchange="setTask(${t.id},this.value)">${['Не начато','В процессе','Готово','Сдано','Принято'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="small" onclick="deleteTask(${t.id})">Удалить</button></div></div>`).join('')}
function home(){let d=now(),less=dayLessons(d),n=d.getHours()*60+d.getMinutes(),current=less.find(l=>timeMin(l.start)<=n&&n<timeMin(l.end)),next=less.find(l=>timeMin(l.start)>n),done=tasks.filter(t=>['Готово','Сдано','Принято'].includes(t.status)).length,open=tasks.filter(t=>!['Сдано','Принято'].includes(t.status)).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="eyebrow">МГТУ им. Н. Э. Баумана · ИУ5-14/4</div><h1>Моя Бауманка</h1><div class="row"><span class="muted">${d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</span><span class="pill">${weekParity(d)===0?'Числитель':'Знаменатель'}</span></div><section class="card hero"><div class="eyebrow">${current?'● Пара сейчас':next?'Следующая пара':'Занятий сейчас нет'}</div>${current||next?`<h2>${esc(subjects[(current||next).sub])}</h2><div class="muted">${(current||next).start}–${(current||next).end} · ${esc((current||next).room||'Аудитория не указана')}</div><div class="muted">${esc((current||next).building||'')} · ${esc((current||next).teacher||'')}</div>${current?`<div class="row" style="margin-top:17px"><span class="smalltext">До конца пары</span><strong>${timeMin(current.end)-n} мин</strong></div><div class="progress"><div style="width:${Math.max(0,Math.min(100,(n-timeMin(current.start))/(timeMin(current.end)-timeMin(current.start))*100))}%"></div></div>`:`<div class="notice" style="margin-bottom:0">Начало в ${(next).start}</div>`}`:'<h2>Можно немного выдохнуть</h2><div class="muted">Проверь ближайшие задания и дедлайны.</div>'}</section><div class="statgrid"><div class="statcard"><div class="iconbox">✓</div><div class="muted">Задания готовы</div><div class="big">${done}<span class="smalltext"> / ${tasks.length}</span></div><div class="progress green"><div style="width:${tasks.length?100*done/tasks.length:0}%"></div></div></div><div class="statcard"><div class="iconbox">◷</div><div class="muted">Активные задачи</div><div class="big">${open.length}</div><div class="smalltext"> function scoresPage(){const ps=Math.min(100,Math.round(pe.points/60*100)),vs=Math.min(100,Math.round(pe.visits/25*100));return `<div class="eyebrow">Результаты и посещаемость</div><h1>Успеваемость</h1><div class="sectionhead"><h2>Физкультура и спорт</h2><span class="badge blue">БРС</span></div><div class="statgrid"><div class="statcard"><div class="row"><div class="iconbox">⚑</div><strong style="color:#a9c4ff">${ps}%</strong></div><div class="muted">Баллы БРС</div><div class="big">${pe.points}<span class="smalltext"> / 60 б.</span></div><div class="progress"><div style="width:${ps}%"></div></div></div><div class="statcard"><div class="row"><div class="iconbox" style="background:#1b4748;color:#72ded4">♧</div><strong style="color:#72ded4">${vs}%</strong></div><div class="muted">Посещения</div><div class="big">${pe.visits}<span class="smalltext"> / 25 пос.</span></div><div class="progress teal"><div style="width:${vs}%"></div></div></div></div><div class="notice ${pe.points>=60&&pe.visits>=25?'good':''}">${pe.points>=60&&pe.visits>=25?'✓ Оба норматива выполнены. Официальное подтверждение зачёта проверяй в ЛК.':`До выполнения нормативов: ${Math.max(0,60-pe.points)} баллов и ${Math.max(0,25-pe.visits)} посещений.`}</div><section class="card"><h2>Обновить физру</h2><div class="scoreline"><span>Баллы</span><input aria-label="Баллы физкультуры" type="number" min="0" value="${pe.points}" onchange="updatePe('points',this.value)"></div><div class="scoreline"><span>Посещения</span><input aria-label="Посещения физкультуры" type="number" min="0" value="${pe.visits}" onchange="updatePe('visits',this.value)"></div></section><div class="sectionhead"><h2>Оценки по предметам</h2></div>${Object.entries(subjects).filter(([k])=>k!=='pe'&&scores.some(s=>s.sub===k)).map(([k,v])=>`<section class="card"><h2>${esc(v)}</h2>${scores.filter(s=>s.sub===k).map(s=>`<div class="scoreline"><span class="muted">${esc(s.name)}</span><input aria-label="${esc(s.name)}" type="number" value="${s.value}" onc /* v12 grade labels migration: retain every numeric value and record id. */
(function migrateModuleLabels(){
 const marker='baumanka_v12_module_labels';
 if(localStorage.getItem(marker))return;
 const perSubject={};let changed=false;
 for(const s of scores){
   if(!/^Модуль\s+\d+$/i.test(String(s.name)))continue;
   const n=(perSubject[s.sub]||0)+1;perSubject[s.sub]=n;
   const next=n<=2?'Модуль '+n:'Дополнительные баллы';
   if(s.name!==next){s.name=next;changed=true}
 }
 if(changed)save();
 try{localStorage.setItem(marker,'1')}catch(e){}
})();
function v12Grades(){
 const subjectsWithScores=Object.entries(subjects).filter(([k])=>k!=='pe');
 const total=scores.filter(s=>s.sub!=='pe').reduce((n,s)=>n+(Number(s.value)||0),0);
 const blocks=subjectsWithScores.map(([key,name],idx)=>{
   const entries=scores.filter(s=>s.sub===key),sum=entries.reduce((n,s)=>n+(Number(s.value)||0),0);
   const short=(name.match(/[А-ЯЁ]/g)||[]).slice(0,2).join('')||'•';
   const empty=entries.length===0;
   return `<details class="grade-subject" ${idx===0?'open':''}><summary><span class="grade-icon">${esc(short)}</span><span class="grade-name">${esc(name)}</span><span class="grade-count">${empty?'Нет баллов':sum+' б.'}</span><span class="grade-chevron" aria-hidden="true">⌄</span></summary><div class="grade-fields">${entries.map(s=>`<div class="grade-field"><label for="grade-${s.id}">${esc(s.name)}</label><input id="grade-${s.id}" aria-label="${esc(name)}: ${esc(s.name)}" type="number" inputmode="decimal" min="0" value="${Number(s.value)||0}" onchange="v12SetScore(${s.id},this.value)"></div>`).join('')}${empty?`<p class="muted">Оценки ещё не внесены</p>`:''}<button class="btn" onclick="v131AddScore('${key}')">＋ Добавить модуль или результат</button></div></details>`;
 }).join('');
 return `<div class="eyebrow">Учёба / Баллы</div><h1>Успеваемость</h1><div class="grades-intro"><p>Баллы по предметам. Нажми на дисциплину, чтобы изменить результат модуля.</p></div>
 <div class="grade-overview"><div><span>Предметов с баллами</span><strong>${new Set(scores.filter(s=>s.sub!=='pe').map(s=>s.sub)).size} / ${subjectsWithScores.length}</strong></div><div><span>Всего введено баллов</span><strong>${total}</strong></div></div>
 <div class="grade-section-title">Дисциплины</div><div class="grade-list">${blocks}</div><p class="grade-footnote">Модули обозначены как 1 и 2. Дополнительные записи сохранены без потери баллов. Данные введены вручную и не синхронизируются с официальным ЛК.</p>
 <section class="card"><div class="row"><h2>Физкультура</h2><span class="badge blue">Учёт БРС</span></div><div class="pe-compact"><div class="pe-tile"><label for="v12-pe-points">Баллы</label><input id="v12-pe-points" type="number" min="0" value="${pe.points}" onchange="updatePe('points',this.value)"><span class="smalltext">из 60</span></div><div class="pe-tile"><label for="v12-pe-visits">Посещения</label><input id="v12-pe-visits" type="number" min="0" value="${pe.visits}" onchange="updatePe('visits',this.value)"><span class="smalltext">из 25</span></div></div></section>${scoreChart()}`;
}
function v131AddScore(key){
 const entries=scores.filter(s=>s.sub===key);
 const suggested=entries.some(s=>s.name==='Модуль 1')?(entries.some(s=>s.name==='Модуль 2')?'Дополнительные баллы':'Модуль 2'):'Модуль 1';
 const name=prompt('Название результата',suggested);
 if(name===null||!name.trim())return;
 const id=Math.max(0,...scores.map(s=>Number(s.id)||0))+1;
 scores.push({id,sub:key,name:name.trim(),value:0});save();
 document.querySelector('#app').innerHTML=v12Grades();
 const idx=Object.keys(subjects).filter(k=>k!=='pe').indexOf(key);
 const target=document.querySelectorAll('.grade-subject')[idx];if(target){target.open=true;target.scrollIntoView({block:'center',behavior:'smooth'});}
}
function v12SetScore(id,value){const item=scores.find(s=>s.id===id);if(!item)return;item.value=Math.max(0,Number(value)||0);save();const expanded=[...document.querySelectorAll('.grade-subject')].map((e,i)=>e.open?i:-1).filter(i=>i>=0);document.querySelector('#app').innerHTML=v12Grades();document.querySelectorAll('.grade-subject').forEach((e,i)=>e.open=expanded.includes(i))}

/* v14.1: actual navigation, including iOS/browser Back, without touching saved grades */
const v141Root={tab:'home',section:'scores'};
let v141Index=0;
function v141State(){return {tab:tab,section:studySection};}
function v141CanBack(){return v141Index>0;}
function v141Navigate(fn){
 const old=v141State();fn();
 if(old.tab===tab && old.section===studySection)return;
 v141Index++;
 history.pushState({baumanka:true,index:v141Index,tab:tab,section:studySection},'',location.pathname+location.search+'#'+encodeURIComponent(tab));

}
function v141Back(){

}

window.addEventListener('popstate',e=>{
 const st=e.state;
 if(st&&st.baumanka){v141Index=st.index||0;tab=st.tab||'home';studySection=st.section||'scores';}
 else {v141Index=0;tab='home';studySection='scores';}
 render();window.scrollTo(0,0);
});
if(!history.state||!history.state.baumanka){history.replaceState({baumanka:true,index:0,tab:tab,section:studySection},'',location.pathname+location.search);}
else{v141Index=history.state.index||0;tab=history.state.tab||tab;studySection=history.state.section||studySection;}
if(['scores','exams','plan'].includes(tab)){studySection=tab;tab='study'}setInterval(()=>{if(tab==='home'||tab==='schedule')render()},30000);render();
