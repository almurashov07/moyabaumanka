.flow-campus:after{background:linear-gradient(0deg,#051121f5 0%,transparent 72%)!important}
.flow-campus-label{bottom:18px!important;left:18px!important;right:12px}
.flow-campus-label b{font-size:17px!important;line-height:1.15}

.nav button svg{width:23px!important;height:23px!important}

gress green"><div style="width:${tasks.length?100*done/tasks.length:0}%"></div></div></div><div class="statcard v142-clickable" role="button" tabindex="0" aria-label="Открыть активные задания" onclick="switchTab('tasks')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchTab('tasks')}"><div class="iconbox">◷</div><div class="muted">Активные задачи</div><div class="big">${open.length}</div><div class="smalltext">включая готовые к сдаче</div></div><div class="statcard v142-clickable" role="button" tabindex="0" aria-label="Открыть успеваемость" onclick="switchTab('scores')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchTab('scores')}"><div class="iconbox">⚑</div><div class="muted">Баллы физры</div><div class="big">${pe.points}<span class="smalltext"> / 60</span></div><div class="progress"><div style="width:${Math.min(100,pe.points/60*100)}%"></div></div></div><div class="statcard v142-clickable" role="button" tabindex="0" aria-label="Открыть физкультуру" onclick="switchTab('scores')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchTab('scores')}"><div class="iconbox">♧</div><div class="muted">Посещения</div><div class="big">${pe.visits}<span class="smalltext"> / 25</span></div><div class="progress teal"><div style="width:${Math.min(100,pe.visits/25*100)}%"></div></div></div></div><div class="sectionhead"><h2>Ближайшие дедлайны</h2><button class="btn" onclick="switchTab('tasks')">Все задания →</button></div><section class="card" style="margin-top:0">${taskRows(open.slice(0,4))||'<p class="muted">Заданий нет</p>'}</section>`}
function tasksPage(){let done=tasks.filter(t=>['Готово','Сдано','Принято'].includes(t.status)).length;return `<div class="eyebrow">Учебный трекер</div><h1>Мои задания</h1><section class="card"><div class="row"><div><div class="muted">Подготовлено и выполнено</div><div class="metric">${done} <span>/ ${tasks.length}</span></div></div><span class="badge green">${tasks.length?Math.round(done/tasks.length*100):0}%</span></div><div class="progress green"><div style="width:${tasks.length?done/tasks.length*100:0}%"></div></div><p class="hint">«Готово» не означает «Сдано». Отмечай фактический статус.</p></section><section class="card"><h2>Список заданий</h2>${taskRows([...tasks].sort((a,b)=>a.date.localeCompare(b.date)))}<details><summary>＋ Добавить задание</summary><div class="formgrid"><div class="field"><label>Предмет</label><select id="tsub">${Object.entries(subjects).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Задание</label><input id="ttitle" type="text" placeholder="Что нужно сделать"></div><div class="field"><label>Дедлайн</label><input id="tdate" type="date" value="${iso(now())}"></div><button class="btn primary" onclick="addTask()">Добавить</button></div></details></section>`}
function schedulePage(){let d=dateOfView(),p=weekOverride??weekParity(d),days=['Понедельник','Вторник','Среда','Четверг','Пятница'];return `<div class="eyebrow">Расписание занятий</div><h1>Мои пары</h1><div class="row"><span class="muted">${dateFmt(iso(monday(d)))} – ${dateFmt(iso(add(monday(d),6)))}</span><span class="pill">${p===0?'Числитель':'Знаменатель'}</span></div><div class="btnrow"><button class="btn" onclick="moveWeek(-7)">← Назад</button><button class="btn" onclick="moveWeek(7)">Вперёд →</button><button class="btn ${weekOverride===null?'selected':''}" onclick="setWeek(null)">Авто</button><button class="btn ${weekOverride===0?'selected':''}" onclick="setWeek(0)">ЧС</button><button class="btn ${weekOverride===1?'selected':''}" onclick="setWeek(1)">ЗН</button></div>${days.map((day,i)=>{let dt=add(monday(d),i),ll=dayLessons(dt,p);return `<section class="card day"><div class="row"><h2>${day} · ${dateFmt(iso(dt))}</h2>${iso(dt)===iso(now())?'<span class="badge blue">Сегодня</span>':''}</div>${ll.length?ll.map(l=>lessonHtml(l,dt)).join(''):'<div class="muted">Пар нет</div>'}</section>`}).join('')}<p class="foot">Чередование недель отсчитывается от 9 ноября 2026 года. Часть понедельничных занятий на исходных снимках была обрезана и требует сверки.</p>`}
function scoresPage(){const ps=Math.min(100,Math.round(pe.points/60*100)),vs=Math.min(100,Math.round(pe.visits/25*100));return `<div class="eyebrow">Результаты и посещаемость</div><h1>Успеваемость</h1><div class="sectionhead"><h2>Физкультура и спорт</h2><span class="badge blue">БРС</span></div><div class="statgrid"><div class="statcard"><div class="row"><div class="iconbox">⚑</div><strong style="color:#a9c4ff">${ps}%</strong></div><div class="muted">Баллы БРС</div><div class="big">${pe.points}<span class="smalltext"> / 60 б.</span></div><div class="progress"><div style="width:${ps}%"></div></div></div><div class="statcard"><div class="row"><div class="iconbox" style="background:#1b4748;color:#72ded4">♧</div><strong style="color:#72ded4">${vs}%</strong></div><div class="muted">Посещения</div><div class="big">${pe.visits}<span class="smalltext"> / 25 пос.</span></div><div class="progress teal"><div style="width:${vs}%"></div></div></div></div><div class="notice ${pe.points>=60&&pe.visits>=25?'good':''}">${pe.points>=60&&pe.visits>=25?'✓ Оба норматива выполнены. Официальное подтверждение зачёта проверяй в ЛК.':`До выполнения нормативов: ${Math.max(0,60-pe.points)} баллов и ${Math.max(0,25-pe.visits)} посещений.`}</div><section class="card"><h2>Обновить физру</h2><div class="scoreline"><span>Баллы</span><input aria-label="Баллы физкультуры" type="number" min="0" value="${pe.points}" onchange="updatePe('points',this.value)"></div><div class="scoreline"><span>Посещения</span><input aria-label="Посещения физкультуры" type="number" min="0" value="${pe.visits}" onchange="updatePe('visits',this.value)"></div></section><div class="sectionhead"><h2>Оценки по предметам</h2></div>${Object.entries(subjects).filter(([k])=>k!=='pe'&&scores.some(s=>s.sub===k)).map(([k,v])=>`<section class="card"><h2>${esc(v)}</h2>${scores.filter(s=>s.sub===k).map(s=>`<div class="scoreline"><span class="muted">${esc(s.name)}</span><input aria-label="${esc(s.name)}" type="number" value="${s.value}" onchange="setScore(${s.id},this.value)"></div>`).join('')}</section>`).join('')}<p class="foot">Нулевые оценки в будущих модулях не означают автоматически задолженность.</p>`}
function planPage(){let events=[['4','История России','РК'],['4','Математический анализ','ДЗ'],['4','Алгоритмизация и программирование','ДЗ'],['5','Алгоритмизация и программирование','РК'],['6','Английский язык','Модуль'],['7','Теоретическая информатика','РК'],['8','Аналитическая геометрия','РК'],['10','Математический анализ','РК'],['12','Математический анализ','КР'],['15','Теоретическая информатика','РК']];return `<div class="eyebrow">Семестровый контроль</div><h1>План и РК</h1><section class="card hero"><div class="eyebrow">Ближайшая контрольная</div><h2>Математический анализ</h2><div class="muted">КР по дифференцированию · предварительно 16 ноября</div><div style="margin-top:15px"><span class="badge amber">Подготовка в процессе</span></div></section><section class="card"><h2>Ближайшие ДЗ и события</h2>${taskRows([...tasks].sort((a,b)=>a.date.localeCompare(b.date)))}</section><section class="card"><h2>План семестра · 17 недель</h2><p class="muted">Выборка контрольных мероприятий из присланного плана. Полную матрицу дополним после сверки всех ячеек.</p>${events.map(([w,s,t])=>`<div class="planrow"><div class="planweek">${w}</div><div class="planbody"><strong>${esc(s)}</strong><div class="muted">Учебная неделя ${w}</div></div><span class="badge blue">${t}</span></div>`).join('')}</section>`}
let customAvatar=read('bauman_avatar_v1',null);let profileName=read('bauman_profile_name_v1','');function editProfileName(){const v=prompt('Имя для профиля',profileName);if(v!==null){profileName=v.trim().slice(0,80);localStorage.setItem('bauman_profile_name_v1',JSON.stringify(profileName));render()}}

function updateAvatar(input){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Выбери фотографию.');return}if(file.size>15*1024*1024){alert('Файл слишком большой (максимум 15 МБ).');return}
const reader=new FileReader();reader.onerror=()=>alert('Не удалось открыть фотографию');reader.onload=()=>{const img=new Image();img.onerror=()=>alert('Не удалось прочитать изображение');img.onload=()=>{const size=360,canvas=document.createElement('canvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d');const side=Math.min(img.naturalWidth,img.naturalHeight);ctx.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,size,size);const data=canvas.toDataURL('image/jpeg',0.83);try{localStorage.setItem('bauman_avatar_v1',JSON.stringify(data));customAvatar=data;render()}catch(e){alert('Браузер не разрешил сохранить фото. Попробуй фотографию меньшего размера или открой сайт в Safari.')}};img.src=reader.result};reader.readAsDataURL(file)}
function profilePage(){return `<div class="eyebrow">Студенческий профиль</div><h1>Личный кабинет</h1><div class="profile-cover"><div class="dept"><span style="font-size:13px;display:block">КАФЕДРА</span>ИУ5</div></div><div class="avatar-edit"><img class="profile-avatar" id="profile-avatar" src="${customAvatar||'avatar-placeholder.svg'}" alt="Фото профиля"><button class="avatar-camera" aria-label="Изменить аватарку" onclick="chooseAvatar()">✎</button></div><input id="avatar-upload" type="file" accept="image/*" style="display:none" onchange="updateAvatar(this)"><div class="avatar-actions"><button onclick="chooseAvatar()">Изменить фото</button><button onclick="resetAvatar()">Вернуть исходное</button></div><div class="avatar-hint">Фото обрезается до квадрата и сохраняется на этом устройстве.</div><div class="profile-title">${esc(profileName||"Студент Бауманки")}</div><div class="profile-sub">ИУ5-14/4 · 1 курс</div><div class="avatar-actions"><button onclick="editProfileName()">Изменить имя</button></div><section class="card"><h2>Мои данные</h2><div class="profile-detail"><span>Университет</span><strong>МГТУ им. Н. Э. Баумана</strong></div><div class="profile-detail"><span>Кафедра</span><strong>ИУ5</strong></div><div class="profile-detail"><span>Группа</span><strong>ИУ5-14/4</strong></div><div class="profile-detail"><span>Учебный год</span><strong>2026/2027</strong></div></section><section class="card"><h2>Физкультура</h2><div class="profile-detail"><span>Группа здоровья</span><strong>Основная с плаванием</strong></div><div class="profile-detail"><span>Паспорт здоровья до</span><strong>24.06.2027</strong></div><div class="profile-detail"><span>Баллы БРС</span><strong>${pe.points} / 60</strong></div><div class="profile-detail"><span>Посещения</span><strong>${pe.visits} / 25</strong></div><button class="btn" style="margin-top:15px;width:100%" onclick="switchTab('scores')">Перейти к успеваемости →</button></section><section class="card"><h2>Электронный пропуск</h2><p class="muted">Для прохода в университет используй действующий QR-код из официального личного кабинета. Здесь он не копируется и не сохраняется: код доступа может обновляться, а его публикация небезопасна.</p><div class="notice">🔒 Пропуск открывай в официальном приложении или личном кабинете Бауманки.</div></section><p class="foot">Личный учебный органайзер, не официальный сервис университета.</p>`}

function examDate(d){if(!d)return 'Дата не назначена';let [y,m,day]=d.split('-');return `${day}.${m}.${y}`}
function examsPage(){const sorted=[...exams].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
return `<div class="eyebrow">Сессия · январь 2027</div><h1>Экзамены</h1>
<div class="exam-summary"><div><span>Всего экзаменов</span><strong>${exams.length}</strong></div><div><span>Дата известна</span><strong>${exams.filter(e=>e.date).length} / ${exams.length}</strong></div></div>
<p class="muted">Даты и аудитории можно менять вручную. Неизвестные данные оставлены пустыми.</p>
${sorted.map(e=>`<section class="exam-card ${e.type==='Распределённый экзамен'?'distributed':''}"><div class="row"><span class="exam-type">${esc(e.type)}</span><span class="badge ${e.status==='Сдан'?'green':e.status==='Дата уточняется'?'amber':'blue'}">${esc(e.status)}</span></div><div class="exam-name">${esc(e.subject)}</div><div class="exam-meta"><span>◷ ${examDate(e.date)}${e.time?' · '+esc(e.time):''}</span><span>⌖ ${e.room?esc(e.room):'Аудитория неизвестна'}</span></div><div class="exam-buttons"><button class="btn" onclick="showExamEditor('${e.id}')">✎ Изменить</button><button class="btn" onclick="deleteExam('${e.id}')">Удалить</button></div></section>`).join('')}
<section class="card"><h2 id="exam-form-title">Добавить экзамен</h2><div class="exam-form"><input type="hidden" id="exam-id"><label>Предмет<input type="text" id="exam-subject" placeholder="Название предмета"></label><label>Тип<select id="exam-type"><option>Экзамен</option><option>Распределённый экзамен</option></select></label><label>Дата (можно оставить пустой)<input type="date" id="exam-date"></label><label>Время (можно оставить пустым)<input type="time" id="exam-time"></label><label>Аудитория<input type="text" id="exam-room" placeholder="Пока неизвестна"></label><label>Статус<select id="exam-status"><option>Запланирован</option><option>Дата уточняется</option><option>Подготовка</option><option>Сдан</option></select></label><div class="exam-buttons"><button class="btn primary" onclick="saveExamForm()">Сохранить экзамен</button><button class="btn" onclick="clearExamForm()">Очистить</button></div></div></section>
<p class="foot">Экзамены сохраняются локально в браузере. Для переноса между устройствами потребуется синхронизация.</p>`}
function showExamEditor(id){let e=exams.find(x=>x.id===id);if(!e)return;document.getElementById('exam-id').value=e.id;document.getElementById('exam-subject').value=e.subject;document.getElementById('exam-type').value=e.type;document.getElementById('exam-date').value=e.date;document.getElementById('exam-time').value=e.time;document.getElementById('exam-room').value=e.room;document.getElementById('exam-status').value=e.status;document.getElementById('exam-form-title').textContent='Редактировать экзамен';document.getElementById('exam-form-title').scrollIntoView({behavior:'smooth',block:'center'})}
function clearExamForm(){['exam-id','exam-subject','exam-date','exam-time','exam-room'].forEach(id=>document.getElementById(id).value='');document.getElementById('exam-type').value='Экзамен';document.getElementById('exam-status').value='Запланирован';document.getElementById('exam-form-title').textContent='Добавить экзамен'}
function saveExamForm(){const val=id=>document.getElementById('exam-'+id).value.trim();let subject=val('subject');if(!subject){alert('Укажи название предмета');return}let id=val('id')||'exam_'+Date.now();let e={id,subject,type:val('type'),date:val('date'),time:val('time'),room:val('room'),status:val('status')};let idx=exams.findIndex(x=>x.id===id);if(idx<0)exams.push(e);else exams[idx]=e;saveExams();render()}
function deleteExam(id){if(!confirm('Удалить экзамен из списка?'))return;exams=exams.filter(e=>e.id!==id);saveExams();render()}

 const entries=scores.filter(s=>s.sub===key);
 const suggested=entries.some(s=>s.name==='Модуль 1')?(entries.some(s=>s.name==='Модуль 2')?'Дополнительные баллы':'Модуль 2'):'Модуль 1';
 const name=prompt('Название результата',suggested);
 if(name===null||!name.trim())return;
 const id=Math.max(0,...scores.map(s=>Number(s.id)||0))+1;
 scores.push({id,sub:key,name:name.trim(),value:0});save();

}

/* v14: apply new navigation to the full v13.1 application, retaining all storage keys */
const v14Tabs=[['home','Главная'],['schedule','Пары'],['tasks','Задания'],['study','Учёба'],['calendar','Календарь']];
const v14CalendarIcon='<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 14h3M14 14h3M8 18h3"/>';

  if(tab==='calendar')tab='v11_calendar';

  const app=document.getElementById('app'),nav=document.getElementById('nav');

/* v14.1: actual navigation, including iOS/browser Back, without touching saved grades */
const v141Root={tab:'home',section:'scores'};
let v141Index=0;
function v141State(){return {tab:tab,section:studySection};}
function v141CanBack(){return !['home','schedule','tasks','study','v11_calendar'].includes(tab);}
function v141Navigate(fn){
 const old=v141State();fn();
 if(old.tab===tab && old.section===studySection)return;
 v141Index++;
 history.pushState({baumanka:true,index:v141Index,tab:tab,section:studySection},'',location.pathname+location.search+'#'+encodeURIComponent(tab));
 render();window.scrollTo({top:0,behavior:'instant'});
}
function v141Back(){
 if(v141CanBack()){if(v141Index>0){history.back();return;}tab='home';render();window.scrollTo(0,0);}
}
const v141SwitchTab=switchTab;
switchTab=function(t){v141Navigate(()=>{if(['scores','exams','plan'].includes(t)){studySection=t;tab='study'}else tab=t;});};
const v141SwitchStudy=switchStudy;
switchStudy=function(section){v141Navigate(()=>{studySection=section;tab='study';});};
openV11=function(t){v141Navigate(()=>{tab='v11_'+t;});};
v14Go=function(t){switchTab(t==='calendar'?'v11_calendar':t);};
v14Profile=function(){switchTab('profile');};
window.addEventListener('popstate',e=>{
 const st=e.state;
 if(st&&st.baumanka){v141Index=st.index||0;tab=st.tab||'home';studySection=st.section||'scores';}
 else {v141Index=0;tab='home';studySection='scores';}
 render();window.scrollTo(0,0);
});
if(!history.state||!history.state.baumanka){history.replaceState({baumanka:true,index:0,tab:tab,section:studySection},'',location.pathname+location.search);}
else{v141Index=history.state.index||0;tab=history.state.tab||tab;studySection=history.state.section||studySection;}
if(['scores','exams','plan'].includes(tab)){studySection=tab;tab='study'}setInterval(()=>{if(tab==='home'||tab==='schedule')render()},15000);render();

function flowThemePanel(){return `<section class="flow-theme-panel"><h2>Тема оформления</h2><div class="flow-theme-options"><button type="button" aria-pressed="${flowTheme==='dark'}" onclick="flowSetTheme('dark')">☾ Тёмная</button><button type="button" aria-pressed="${flowTheme==='light'}" onclick="flowSetTheme('light')">☀ Светлая</button></div><p class="muted" style="font-size:12px;margin:12px 0 0">Настройка сохраняется на этом устройстве.</p></section>`}

 if(tab==='profile'){app.insertAdjacentHTML('afterbegin',flowThemePanel());}

 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',flowTheme==='dark'?'#07111f':'#eef4fc');
};
