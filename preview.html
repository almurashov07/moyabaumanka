{left:11px}.hamster-cheek.right{right:11px}.hamster-mouth{position:absolute;top:76px;left:50%;transform:translateX(-50%);color:#7d4c40;font-size:28px;line-height:1}.hamster-score-label{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}.hamster-score{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0 12px;font-variant-numeric:tabular-nums}.fun-select-label{display:grid;gap:8px;font-size:12px;color:var(--muted);margin:20px 0}.fun-select-label select{width:100%;font-size:14px}.zodiac-orbit{position:relative;margin:12px auto 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;width:170px;height:170px;border:1px solid #82adff55;border-radius:50%;background:radial-gradient(circle,#2d6aa55a,#13253b11 65%,transparent);box-shadow:0 0 0 12px #70a7ff0a,inset 0 0 40px #72b5ff23}.zodiac-orbit:before{content:"";position:absolute;inset:13px;border:1px dashed #87b9ff50;border-radius:50%;animation:zodiac-spin 40s linear infinite}.zodiac-star{font-size:35px;color:#8ac4ff}.zodiac-name{font-size:22px;font-weight:800;margin-top:4px}.zodiac-date{font-size:11px;color:var(--muted);margin-top:6px}.horoscope-message{background:var(--raised);border:1px solid var(--line);border-radius:15px;padding:17px;line-height:1.7;font-size:14px;font-weight:600;margin-bottom:14px}@keyframes zodiac-spin{to{transform:rotate(360deg)}}.fun-profile-link{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);font-size:14px;font-weight:800}.fun-profile-link svg{color:var(--accent)}.fun-profile-link span{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}@media(max-width:700px){.fun-grid{grid-template-columns:1fr}.fun-grid .panel{min-height:0}.fun-page .hamster-panel{padding-bottom:25px}}@media(prefers-reduced-motion:reduce){.zodiac-orbit:before,.hamster-button.bop{animation:none!important}}

/* After Hours: chaotic horoscope */
.fun-chaos{margin:16px 0 12px;padding:13px;border-radius:15px;background:rgba(126,91,205,.11);border:1px solid rgba(172,144,255,.26)}
.fun-chaos .between{gap:10px;font-size:10px;letter-spacing:.7px;font-weight:800;color:var(--muted,#b6c5db)}
.fun-chaos strong{font-size:18px;color:#d1a8ff}.fun-chaos-track{height:8px;margin-top:11px;border-radius:99px;background:rgba(145,126,175,.24);overflow:hidden}
.fun-chaos-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7d8eff,#c76df7,#ff8b8b);animation:funfill .65s cubic-bezier(.2,.8,.2,1) both}
.fun-advice{margin:12px 0 16px;padding:13px 15px;border-left:3px solid #a77bf7;border-radius:8px 14px 14px 8px;background:rgba(141,108,212,.12);line-height:1.5;font-size:13px}
.horoscope-message{line-height:1.6;font-size:15px}
@keyframes funfill{from{transform:scaleX(.1);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@media(prefers-reduced-motion:reduce){.fun-chaos-track i{animation:none}}

ун включил режим плавания по потоку незакрытых лаб."},"starts":["Сегодня препод спросит то, чего не было ни на одной лекции.","Твоя зачётка получит загадочное уведомление из параллельной вселенной.","В столовой объявят битву за последнюю нормальную котлету.","Компилятор найдёт ошибку там, где ты уже успел отпраздновать победу.","В метро ты случайно встретишь собственную мотивацию. Она едет в обратную сторону.","Кто-то в группе скажет «там лёгкая лаба», и пространство-время треснет.","Преподаватель произнесёт «это элементарно» с лицом финального босса.","Твоя тетрадь внезапно станет историческим документом о потерянных надеждах.","На контрольной появится формула, которую никто не видел даже во сне.","Будильник заключит тайный союз с первой парой.","В чате группы всплывёт сообщение «срочно сдаём сегодня».","Твой ноутбук решит обновиться за минуту до защиты.","В библиотеке ты обнаружишь учебник, который понимает тебя ещё меньше, чем ты его.","Кофе сегодня будет смотреть на тебя с осуждением.","Староста принесёт новости с интонацией диктора конца света."],"ends":["Главное, не кричи «какого хуя» раньше, чем назовут номер варианта.","Звёзды рекомендуют сделать вид, что так и было задумано. Убедительно, сука.","Если услышишь слово «пересдача», делай лицо человека, который просто зашёл за мелом.","Твой шанс на успех повысится, если хотя бы открыть нужный файл.","Вселенная уверена в тебе. А вот система электронного журнала пока сомневается.","Не паникуй: даже космос иногда выдаёт ошибку 404.","Сохрани работу дважды, иначе ретроградный Меркурий утащит её в жопу.","Не пытайся спорить с матаном: у него бесконечность аргументов.","Счастливый предмет дня: ручка, которая, блядь, пишет.","Академическая удача включится после перезагрузки мозга и нормального обеда.","Космический совет: лучше десять минут подготовки, чем час героического пиздежа.","Никакой мистики: просто ты опять забыл, где лежит отчёт."]};

const zodiacSigns=['Овен','Телец','Близнецы','Рак','Лев','Дева','Весы','Скорпион','Стрелец','Козерог','Водолей','Рыбы'];
// 180 different predictions per zodiac sign. The cycle visits every prediction once.
const horoscopeBank=window.BAUMAN_HOROSCOPE;
function dailyHoroscope(sign, day){
 const si=Math.max(0,zodiacSigns.indexOf(sign));
 const dayNumber=Math.floor(Date.UTC(day.getFullYear(),day.getMonth(),day.getDate())/86400000);
 const position=((dayNumber*73+si*37)%180+180)%180; // 73 and 180 are coprime
 const lead=horoscopeBank.starts[Math.floor(position/12)];
 const ending=horoscopeBank.ends[position%12];
 return horoscopeBank.intro[sign]+' '+lead+' '+ending;
}
const funAdvice=['Совет дня: открой конспект хотя бы на пять минут. Космос охуеет от неожиданности.','Талисман дня: рабочая ручка. Редкий артефакт, не потеряй.','Счастливое число: 2. Столько вкладок браузера закрой перед учёбой.','Космический лайфхак: сначала сохрани файл, потом экспериментируй.','Не спорь с компилятором. Он упрямее тебя и, к сожалению, прав чаще.','Звёзды советуют нормально поесть и выспаться. Да, даже гороскоп устал от твоего расписания.'];
function funPage(){let day=Math.floor(new Date().setHours(0,0,0,0)/86400000),signIndex=zodiacSigns.indexOf(fun.sign),forecast=dailyHoroscope(fun.sign,new Date()),advice=funAdvice[((day+signIndex*3)%funAdvice.length+funAdvice.length)%funAdvice.length],chaos=25+((day*17+signIndex*29)%76);return `<div class="page fun-page"><div class="fun-intro"><span class="kicker">BAUMAN · AFTER HOURS</span><h2>Перерыв тоже по расписанию</h2><p>Немного безумия между дедлайнами. Хомяк и 2160 вариантов космической катастрофы.</p></div><div class="fun-grid"><section class="panel hamster-panel"><div class="between"><div><div class="kicker">МИНИ-ИГРА</div><h2>Бауманский хомяк</h2></div><span class="pill">Без доната</span></div><p class="sub">Нажимай на хомяка и собирай виртуальные тапсы. Никакой крипты, только наука и щёки.</p><button id="hamster-button" class="hamster-button" data-action="hamster" aria-label="Тапнуть хомяка"><span class="hamster-face"><span class="hamster-ear left"></span><span class="hamster-ear right"></span><span class="hamster-eye left"></span><span class="hamster-eye right"></span><span class="hamster-nose"></span><span class="hamster-cheek left"></span><span class="hamster-cheek right"></span><span class="hamster-mouth">ω</span></span></button><div class="hamster-score-label">ТВОИ ТАПСЫ</div><div id="hamster-score" class="hamster-score" aria-live="polite">${fun.taps.toLocaleString('ru-RU')}</div><button class="btn" data-action="hamsterreset">Сбросить счётчик</button></section><section class="panel horoscope-panel"><div class="kicker">КОСМИЧЕСКИЙ ПИЗДЕЦ</div><h2>Ебанутый гороскоп</h2><p class="sub">Сатирический прогноз, основанный на чистом абсурде. Звёзды за твои оценки не отвечают.</p><label class="fun-select-label">Твой знак зодиака<select class="input" id="zodiac-select" aria-label="Знак зодиака">${zodiacSigns.map(z=>`<option ${fun.sign===z?'selected':''}>${z}</option>`).join('')}</select></label><div class="zodiac-orbit"><div class="zodiac-star">✦</div><div class="zodiac-name">${e(fun.sign)}</div><div class="zodiac-date">${weekday(today())}</div></div><div class="fun-chaos"><div class="between"><span>УРОВЕНЬ АКАДЕМИЧЕСКОГО ПИЗДЕЦА</span><strong>${chaos}%</strong></div><div class="fun-chaos-track"><i style="width:${chaos}%"></i></div></div><div class="horoscope-message">${e(forecast)}</div><div class="fun-advice">${e(advice)}</div><div class="sub">180 неповторяющихся дней для каждого знака. Всё это шутка, а не реальное предсказание.</div></section></div></div>`}

function render(){const pages={home,schedule:schedulePage,tasks:tasksPage,study:studyPage,calendar:calendarPage,profile:profilePage,fun:funPage};document.getElementById('app').innerHTML=`<div class="shell">${head()}${(pages[ui.page]||home)()}</div>${nav()}${sheet()}`;document.querySelector('meta[name="theme-color"]').content=document.documentElement.dataset.theme==='light'?'#edf3fb':'#07121f'}
const toast=message=>{document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2300)};
function changePage(p){ui.page=p;ui.sheet=null;render();scrollTo({top:0,behavior:'instant'})}
function action(a){if(!a)return;let [cmd,...parts]=a.split(':'),arg=parts.join(':');if(cmd==='page')changePage(arg);else if(cmd==='profile')changePage('profile');else if(cmd==='study'){ui.study=arg;changePage('study')}else if(cmd==='subjects'){ui.study='subjects';changePage('study')}else if(cmd==='expand'){ui.expanded=ui.expanded===arg?null:arg;render()}else if(cmd==='sheet'){ui.sheet=arg;render()}else if(cmd==='close'){ui.sheet=null;render()}else if(cmd==='subject'){ui.sheet='subject|'+arg;render()}else if(cmd==='date'){ui.date=arg==='today'?today():/^-?\d+$/.test(arg)?add(ui.date,Number(arg)):new Date(arg+'T12:00:00');render()}else if(cmd==='week'){ui.week=(ui.week??parity(ui.date))===0?1:0;render()}else if(cmd==='month'){ui.calendar=new Date(ui.calendar.getFullYear(),ui.calendar.getMonth()+Number(arg),1);render()}else if(cmd==='select'){ui.selected=new Date(arg+'T12:00:00');render()}else if(cmd==='tasktoggle'){let t=data.tasks.find(x=>String(x.id)===arg);if(t){t.status=done(t)?'В процессе':'Готово';persist();render();toast('Статус сохранён')}}else if(cmd==='taskedit'){ui.sheet='task|'+arg;render()}else if(cmd==='examedit'){ui.sheet='exam|'+arg;render()}else if(cmd==='taskdelete'){if(confirm('Удалить задание?')){data.tasks=data.tasks.filter(x=>String(x.id)!==arg);persist();ui.sheet=null;render()}}else if(cmd==='examdelete'){if(confirm('Удалить экзамен?')){data.exams=data.exams.filter(x=>String(x.id)!==arg);persist();ui.sheet=null;render()}}else if(cmd==='scoreadd'){let [k,module]=arg.split(':');data.scores.push({id:Math.max(0,...data.scores.map(s=>Number(s.id)||0))+1,sub:k,name:'Модуль '+module,value:0});persist();render();toast('Модуль добавлен')}else if(cmd==='scoredelete'){if(confirm('Удалить результат?')){data.scores=data.scores.filter(s=>String(s.id)!==arg);persist();render()}}else if(cmd==='prepadd'){let input=document.getElementById('prep-'+arg),v=input?.value.trim();if(v){(data.prep[arg]??=[]).push({title:v,done:false});persist();render()}}else if(cmd==='prepdelete'){let i=arg.lastIndexOf(':'),id=arg.slice(0,i),index=Number(arg.slice(i+1));data.prep[id]?.splice(index,1);persist();render()}else if(cmd==='removechange'){data.changes.splice(Number(arg),1);persist();render()}else if(cmd==='hamster'){fun.taps++;localStorage.setItem('baumanka_fun_hamster_taps',String(fun.taps));let el=document.getElementById('hamster-score');if(el)el.textContent=fun.taps.toLocaleString('ru-RU');let h=document.getElementById('hamster-button');if(h){h.classList.remove('bop');void h.offsetWidth;h.classList.add('bop')} }else if(cmd==='hamsterreset'){if(confirm('Сбросить счётчик хомяка?')){fun.taps=0;localStorage.setItem('baumanka_fun_hamster_taps','0');render()}}else if(cmd==='zodiac'){fun.sign=arg;localStorage.setItem('baumanka_fun_sign',arg);render()}else if(cmd==='theme')setTheme(arg);else if(cmd==='avatar')document.getElementById('avatar-file')?.click();else if(cmd==='avatarclear'){data.avatar=null;persist();render()}else if(cmd==='backup')backup();else if(cmd==='restore')document.getElementById('backup-file')?.click()}
function submitEditor(form){let v=Object.fromEntries(new FormData(form).entries()),[kind,id]=ui.sheet.split('|');if(kind==='task'){if(!v.title?.trim())return toast('Введи название');let t=data.tasks.find(x=>String(x.id)===id);if(!t){t={id:Math.max(0,...data.tasks.map(x=>Number(x.id)||0))+1};data.tasks.push(t)}Object.assign(t,{sub:v.sub,title:v.title.trim(),date:v.date,status:v.status,note:v.note})}else if(kind==='exam'){if(!v.subject?.trim())return toast('Введи предмет');let x=data.exams.find(x=>String(x.id)===id);if(!x){x={id:'exam_'+Date.now()};data.exams.push(x)}Object.assign(x,{subject:v.subject.trim(),type:v.type,date:v.date,time:v.time,room:v.room,status:v.status})}else if(kind==='change'){data.changes=data.changes.filter(c=>!(c.date===dateISO(ui.date)&&Number(c.index)===Number(v.index)));data.changes.push({date:dateISO(ui.date),index:Number(v.index),mode:v.mode,start:v.start,end:v.end,room:v.room})}else if(kind==='name')data.name=v.name.trim().slice(0,70)||'Александр';persist();ui.sheet=null;render();toast('Сохранено')}
function setTheme(t){localStorage.setItem('nova_theme',t);let light=t==='system'?matchMedia('(prefers-color-scheme:light)').matches:t==='light';document.documentElement.dataset.theme=light?'light':'dark';render()}
function backup(){let storage={};for(let k of keys){let v=localStorage.getItem(k);if(v!==null)storage[k]=v}let blob=new Blob([JSON.stringify({format:'moya-baumanka-backup',version:1,created:new Date().toISOString(),storage},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moya-baumanka-backup-'+dateISO(today())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function restore(file){if(!file||file.size>8e6)return toast('Файл слишком большой');try{let o=JSON.parse(await file.text());if(o.format!=='moya-baumanka-backup'||o.version!==1||!o.storage||typeof o.storage!=='object')throw Error('Неверный формат');for(let [k,v] of Object.entries(o.storage)){if(!keys.includes(k)||typeof v!=='string')throw Error('Недопустимое поле');if(k!=='bauman_exam_draw_migrated')JSON.parse(v)}if(!confirm('Заменить текущие данные резервной копией?'))return;let old=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]));try{keys.forEach(k=>{if(Object.hasOwn(o.storage,k))localStorage.setItem(k,o.storage[k]);else localStorage.removeItem(k)})}catch(err){keys.forEach(k=>{if(old[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,old[k])});throw err}location.reload()}catch(err){toast('Не удалось восстановить копию: '+err.message)}}
async function weather(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current=temperature_2m,weather_code&timezone=Europe%2FMoscow',{cache:'no-store'});if(!r.ok)throw Error();let j=await r.json();ui.weather=Math.round(j.current.temperature_2m)+'° · Москва';ui.weatherCode=j.current.weather_code;if(ui.page==='home')render()}catch{ui.weather='Погода недоступна';if(ui.page==='home')render()}}
document.addEventListener('click',ev=>{let b=ev.target instanceof Element?ev.target.closest('[data-action]'):null;if(!b)return;if(b.classList.contains('sheet-backdrop')&&ev.target!==b)return;action(b.dataset.action)});
document.addEventListener('submit',ev=>{if(ev.target.id==='editor'){ev.preventDefault();submitEditor(ev.target)}});
document.addEventListener('change',ev=>{let t=ev.target;if(t.dataset.score){let x=data.scores.find(s=>String(s.id)===t.dataset.score);if(x){x.value=Math.max(0,Number(t.value)||0);persist();render();toast('Баллы сохранены')}}if(t.dataset.pe){data.pe[t.dataset.pe]=Math.max(0,Number(t.value)||0);persist();toast('Сохранено')}if(t.dataset.prep){let i=t.dataset.prep.lastIndexOf(':'),id=t.dataset.prep.slice(0,i),n=Number(t.dataset.prep.slice(i+1));if(data.prep[id]?.[n]){data.prep[id][n].done=t.checked;persist();render()}}if(t.id==='zodiac-select'){fun.sign=t.value;localStorage.setItem('baumanka_fun_sign',fun.sign);render()}if(t.id==='backup-file')restore(t.files?.[0]);if(t.id==='avatar-file'){let file=t.files?.[0];if(!file?.type.startsWith('image/'))return;if(file.size>15e6)return toast('Файл слишком большой');let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=c.height=320;let x=c.getContext('2d'),side=Math.min(img.width,img.height);x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,320,320);data.avatar=c.toDataURL('image/jpeg',.8);try{persist();render();toast('Фото обновлено')}catch{toast('Не удалось сохранить фото')}};img.src=reader.result};reader.readAsDataURL(file)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.sheet){ui.sheet=null;render()}if(ev.key==='Enter'&&ev.target.matches('[role=button][data-action]'))action(ev.target.dataset.action)});
window.addEventListener('popstate',()=>{ui.sheet=null;changePage('home')});
let theme=localStorage.getItem('nova_theme')||'dark';setTheme(theme);weather();setInterval(()=>{if(ui.page==='home')render()},30000);setInterval(weather,20*60*1000);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
